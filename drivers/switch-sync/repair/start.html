<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    h2 { font-size: 18px; margin-bottom: 6px; color: #111; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 20px; }

    label.field-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #555;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      background: #fff;
    }

    select:focus, input[type="text"]:focus { outline: none; border-color: #007aff; }

    .filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .filter-row input[type="text"] { flex: 1; margin-bottom: 0; }
    .filter-row select             { flex: 1; margin-bottom: 0; }

    #device-list {
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      flex: 1;
      min-height: 100px;
      max-height: 40vh;
      overflow-y: auto;
      margin-bottom: 8px;
      margin-top: 8px;
    }

    .device-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.1s;
    }

    .device-item:last-child { border-bottom: none; }
    .device-item:hover { background: #f7f7f7; }
    .device-item.selected { background: #e8f0fe; }

    .device-item input[type="checkbox"] {
      margin-right: 10px;
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #007aff;
      flex-shrink: 0;
    }

    .choice {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 9px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      line-height: 1;
      cursor: pointer;
      gap: 2px;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .choice input[type="radio"] {
      margin: 0;
      width: 16px;
      height: 16px;
      accent-color: #007aff;
      cursor: pointer;
    }
    .choice input[type="radio"]:disabled {
      accent-color: #ccc;
      cursor: default;
    }

    .device-name { font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .device-zone { font-size: 11px; color: #aaa; margin-left: 6px; white-space: nowrap; flex-shrink: 0; }

    .hint { font-size: 12px; color: #999; margin-bottom: 8px; }

    #selected-section { margin-bottom: 16px; }
    #selected-section .field-label { margin-bottom: 6px; }
    #selected-list {
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
    }
    .sel-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid #f0f0f0;
    }
    .sel-item:last-child { border-bottom: none; }
    .sel-item.missing .device-name { color: #b45309; }
    .sel-item.missing .device-zone { color: #b45309; }
    .sel-remove {
      width: auto;
      padding: 2px 8px;
      margin: 0 0 0 8px;
      background: transparent;
      color: #aaa;
      border: none;
      font-size: 18px;
      line-height: 1;
      flex-shrink: 0;
    }
    .sel-remove:hover { color: #e53e3e; background: transparent; }

    #error-msg {
      color: #e53e3e;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }

    #loading {
      padding: 16px;
      font-size: 13px;
      color: #888;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 8px;
      flex-shrink: 0;
    }

    button:hover { background: #0062cc; }
    button:disabled { background: #aaa; cursor: default; }
  </style>
</head>
<body>

  <h2 id="t-title"></h2>
  <p class="subtitle" id="device-count"></p>

  <div id="selected-section" style="display:none">
    <label class="field-label" id="t-selected-label"></label>
    <div id="selected-list"></div>
  </div>

  <label class="field-label" id="t-devices-label"></label>
  <p class="hint" id="t-hint"></p>
  <p class="hint" id="t-primary-hint"></p>

  <div class="filter-row">
    <input type="text" id="filter-text" oninput="applyFilter()" />
    <select id="filter-zone" onchange="applyFilter()">
      <option value="" id="t-all-zones"></option>
    </select>
  </div>

  <div id="device-list">
    <div id="loading"></div>
  </div>

  <div id="error-msg"></div>

  <button id="btn-save" onclick="saveBinding()" disabled></button>

  <script>
    var availableDevices = [];
    var selectedIds = {};
    var primaryId = null;
    var knownNames = {};
    var missingEntries = []; // [{ id, name }] — selected before, no longer found

    var __ = function(k) { try { return Homey.__(k) || k; } catch(e) { return k; } };

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function initTranslations() {
      document.getElementById('t-title').textContent         = __('repair.title');
      document.getElementById('t-selected-label').textContent = __('repair.selected_label');
      document.getElementById('t-devices-label').textContent = __('wizard.devices_to_sync');
      document.getElementById('t-hint').textContent          = __('wizard.hint_min2');
      document.getElementById('t-primary-hint').textContent  = __('wizard.primary_hint');
      document.getElementById('t-all-zones').textContent     = __('wizard.all_zones');
      document.getElementById('loading').textContent         = __('wizard.loading');
      document.getElementById('btn-save').textContent        = __('repair.btn_save');
      document.getElementById('filter-text').placeholder     = __('wizard.search_placeholder');
      updateCount();
    }

    function showError(msg) {
      var el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = msg ? 'block' : 'none';
    }

    function buildZoneOptions(devices) {
      var seen = {};
      var zones = [];
      devices.forEach(function(d) {
        if (d.zoneId && d.zoneName && !seen[d.zoneId]) {
          seen[d.zoneId] = true;
          zones.push({ id: d.zoneId, name: d.zoneName });
        }
      });
      zones.sort(function(a, b) { return a.name.localeCompare(b.name); });
      var select = document.getElementById('filter-zone');
      zones.forEach(function(z) {
        var opt = document.createElement('option');
        opt.value = z.id;
        opt.textContent = z.name;
        select.appendChild(opt);
      });
    }

    function applyFilter() {
      var text = document.getElementById('filter-text').value.toLowerCase();
      var zoneId = document.getElementById('filter-zone').value;
      var filtered = availableDevices.filter(function(d) {
        return (!text || d.name.toLowerCase().includes(text)) &&
               (!zoneId || d.zoneId === zoneId);
      });
      renderDevices(filtered);
    }

    function renderDevices(devices) {
      var list = document.getElementById('device-list');
      if (devices.length === 0) {
        list.innerHTML = '<div id="loading">' + __('wizard.no_match') + '</div>';
        return;
      }
      list.innerHTML = devices.map(function(d) {
        var checked  = selectedIds[d.id] ? ' checked' : '';
        var selClass = selectedIds[d.id] ? ' selected' : '';
        var isPrimary  = primaryId === d.id ? ' checked' : '';
        var primaryDisabled = !selectedIds[d.id] ? ' disabled' : '';
        var zoneBadge = d.zoneName ? '<span class="device-zone">' + escapeHtml(d.zoneName) + '</span>' : '';
        return '<label class="device-item' + selClass + '" id="item-' + escapeHtml(d.id) + '">' +
          '<input type="checkbox" value="' + escapeHtml(d.id) + '"' + checked + ' onchange="onCheckChange(this)" />' +
          '<label class="choice" title="' + escapeHtml(__('wizard.primary_label')) + '"><input type="radio" name="primary" value="' + escapeHtml(d.id) + '"' + isPrimary + primaryDisabled + ' onchange="setPrimary(this.value)" />' + __('wizard.primary_short') + '</label>' +
          '<span class="device-name">' + escapeHtml(d.name) + '</span>' + zoneBadge +
          '</label>';
      }).join('');
      updateCount();
    }

    function setPrimary(id) {
      primaryId = id || null;
      if (primaryId && !selectedIds[primaryId]) {
        selectedIds[primaryId] = true;
      }
      updateCount();
      applyFilter();
      renderSelected();
    }

    // "Currently Selected" summary — lets you see (and remove) the whole
    // current selection without scrolling a list that can hold 100+ devices,
    // and shows devices that used to be selected but no longer exist.
    function renderSelected() {
      var section = document.getElementById('selected-section');
      var list = document.getElementById('selected-list');

      var validSelected = Object.keys(selectedIds)
        .map(function(id) { return availableDevices.filter(function(d) { return d.id === id; })[0]; })
        .filter(Boolean);

      if (validSelected.length === 0 && missingEntries.length === 0) {
        section.style.display = 'none';
        list.innerHTML = '';
        return;
      }
      section.style.display = '';

      var rows = validSelected.map(function(d) {
        var primaryBadge = primaryId === d.id ? ' &middot; ' + escapeHtml(__('wizard.primary_label')) : '';
        var zoneBadge = d.zoneName ? '<span class="device-zone">' + escapeHtml(d.zoneName) + '</span>' : '';
        return '<div class="sel-item">' +
          '<span class="device-name">' + escapeHtml(d.name) + primaryBadge + '</span>' + zoneBadge +
          '<button type="button" class="sel-remove" onclick="removeSelected(\'' + escapeHtml(d.id) + '\')">&times;</button>' +
          '</div>';
      }).join('');

      var missingRows = missingEntries.map(function(m) {
        return '<div class="sel-item missing">' +
          '<span class="device-name">&#9888; ' + escapeHtml(m.name) + '</span>' +
          '<span class="device-zone">' + escapeHtml(__('repair.not_found')) + '</span>' +
          '</div>';
      }).join('');

      list.innerHTML = rows + missingRows;
    }

    function removeSelected(id) {
      delete selectedIds[id];
      if (primaryId === id) primaryId = null;
      updateCount();
      applyFilter();
      renderSelected();
    }

    function updateCount() {
      var n = Object.keys(selectedIds).length;
      var countEl = document.getElementById('device-count');
      var primaryText = primaryId ? __('wizard.primary_selected') : __('wizard.no_primary');
      countEl.textContent = primaryText + ' · ' + n + ' ' + (n !== 1 ? __('wizard.devices') : __('wizard.device')) + ' ' + __('wizard.selected');
    }

    function onCheckChange(checkbox) {
      if (checkbox.checked) {
        selectedIds[checkbox.value] = true;
        var item = document.getElementById('item-' + checkbox.value);
        if (item) item.classList.add('selected');
      } else {
        delete selectedIds[checkbox.value];
        if (primaryId === checkbox.value) primaryId = null;
        var item = document.getElementById('item-' + checkbox.value);
        if (item) item.classList.remove('selected');
      }
      updateCount();
      applyFilter();
      renderSelected();
    }

    function saveBinding() {
      showError('');
      var deviceIds = Object.keys(selectedIds);
      if (deviceIds.length < 2) { showError(__('wizard.err_min2')); return; }

      document.getElementById('btn-save').disabled = true;

      Homey.emit('save_config', { deviceIds: deviceIds, primaryDeviceId: primaryId })
        .then(function() { Homey.done(); })
        .catch(function(err) {
          showError((err && err.message) || __('repair.err_save'));
          document.getElementById('btn-save').disabled = false;
        });
    }

    initTranslations();

    Homey.emit('get_config', null)
      .then(function(config) {
        config = config || {};
        primaryId = config.primaryDeviceId || null;
        knownNames = config.deviceNames || {};
        (config.deviceIds || []).forEach(function(id) { selectedIds[id] = true; });
        return Homey.emit('get_available_devices', null);
      })
      .then(function(devices) {
        availableDevices = devices || [];
        // Drop any previously-saved device that no longer exists in Homey (e.g.
        // deleted and re-paired with a new ID) — it can never be unchecked since
        // it has no row to render, so it must be cleared here instead. Keep its
        // last-known name so "Currently Selected" can still show what it was.
        var validIds = {};
        availableDevices.forEach(function(d) { validIds[d.id] = true; });
        missingEntries = [];
        Object.keys(selectedIds).forEach(function(id) {
          if (!validIds[id]) {
            missingEntries.push({ id: id, name: knownNames[id] || id });
            delete selectedIds[id];
          }
        });
        if (primaryId && !validIds[primaryId]) primaryId = null;
        buildZoneOptions(availableDevices);
        renderDevices(availableDevices);
        renderSelected();
        document.getElementById('btn-save').disabled = false;
      })
      .catch(function(err) {
        document.getElementById('loading').textContent = __('repair.err_load') + (err && err.message ? ': ' + err.message : '');
      });
  </script>

</body>
</html>
