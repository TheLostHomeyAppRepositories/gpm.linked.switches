<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }
    h2 { font-size: 18px; margin-bottom: 6px; color: #111; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 20px; }
    label.field-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #555;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      background: #fff;
    }
    select:focus, input[type="text"]:focus { outline: none; border-color: #007aff; }
    .filter-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .filter-row input[type="text"] { flex: 1; margin-bottom: 0; }
    .filter-row select { flex: 1; margin-bottom: 0; }
    #device-list {
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      flex: 1;
      min-height: 100px;
      max-height: 42vh;
      overflow-y: auto;
      margin: 8px 0;
    }
    .device-item {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.1s;
    }
    .device-item:last-child { border-bottom: none; }
    .device-item:hover { background: #f7f7f7; }
    .device-item.selected { background: #e8f0fe; }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .choice {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 9px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      line-height: 1;
      cursor: pointer;
      gap: 2px;
    }
    .choice input {
      margin: 0;
      width: 16px;
      height: 16px;
      accent-color: #007aff;
      cursor: pointer;
    }
    .device-name { font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .device-zone { font-size: 11px; color: #aaa; margin-left: 6px; white-space: nowrap; }
    .hint { font-size: 12px; color: #999; margin-bottom: 8px; }

    #selected-section { margin-bottom: 16px; }
    #selected-section .field-label { margin-bottom: 6px; }
    #selected-list {
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
    }
    .sel-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid #f0f0f0;
    }
    .sel-item:last-child { border-bottom: none; }
    .sel-item.missing .device-name { color: #b45309; }
    .sel-item.missing .device-zone { color: #b45309; }
    .sel-remove {
      width: auto;
      padding: 2px 8px;
      margin: 0 0 0 8px;
      background: transparent;
      color: #aaa;
      border: none;
      font-size: 18px;
      line-height: 1;
      flex-shrink: 0;
    }
    .sel-remove:hover { color: #e53e3e; background: transparent; }
    #error-msg {
      color: #e53e3e;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
    #loading {
      padding: 16px;
      font-size: 13px;
      color: #888;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 8px;
      flex-shrink: 0;
    }
    button:hover { background: #0062cc; }
    button:disabled { background: #aaa; cursor: default; }
  </style>
</head>
<body>
  <h2 id="t-title"></h2>
  <p class="subtitle" id="device-count"></p>

  <div id="selected-section" style="display:none">
    <label class="field-label" id="t-selected-label"></label>
    <div id="selected-list"></div>
  </div>

  <label class="field-label" id="t-master-label"></label>
  <p class="hint" id="t-master-hint"></p>
  <div class="filter-row">
    <input type="text" id="filter-text" oninput="applyFilter()" />
    <select id="filter-zone" onchange="applyFilter()">
      <option value="" id="t-all-zones"></option>
    </select>
  </div>

  <div id="device-list">
    <div id="loading"></div>
  </div>

  <label class="field-label" id="t-slaves-label"></label>
  <p class="hint" id="t-slaves-hint"></p>

  <div id="error-msg"></div>

  <button id="btn-save" onclick="saveMaster()" disabled></button>

  <script>
    var availableDevices = [];
    var selectedSlaves = {};
    var masterId = null;
    var filteredSlaveDevices = [];
    var MAX_SLAVES = 9;
    var knownNames = {};
    var missingMaster = null; // { id, name } — selected before, no longer found
    var missingSlaves = [];   // [{ id, name }]

    var __ = function(k) { try { return Homey.__(k) || k; } catch(e) { return k; } };

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function initTranslations() {
      document.getElementById('t-title').textContent = __('master_repair.title');
      document.getElementById('t-selected-label').textContent = __('repair.selected_label');
      document.getElementById('t-master-label').textContent = __('master_wizard.master_device');
      document.getElementById('t-master-hint').textContent = __('master_wizard.master_hint');
      document.getElementById('t-slaves-label').textContent = __('master_wizard.slave_devices');
      document.getElementById('t-slaves-hint').textContent = __('master_wizard.slave_hint');
      document.getElementById('t-all-zones').textContent = __('wizard.all_zones');
      document.getElementById('loading').textContent = __('wizard.loading');
      document.getElementById('btn-save').textContent = __('repair.btn_save');
      document.getElementById('filter-text').placeholder = __('wizard.search_placeholder');
      updateCount();
    }

    function updateCount() {
      var n = Object.keys(selectedSlaves).length;
      var masterText = masterId ? __('master_wizard.master_selected') : __('master_wizard.no_master');
      document.getElementById('device-count').textContent = masterText + ' · ' + n + ' ' + (n !== 1 ? __('wizard.devices') : __('wizard.device')) + ' ' + __('wizard.selected');
    }

    function buildZoneOptions(selectId, devices) {
      var seen = {};
      var zones = [];
      devices.forEach(function(d) {
        if (d.zoneId && d.zoneName && !seen[d.zoneId]) {
          seen[d.zoneId] = true;
          zones.push({ id: d.zoneId, name: d.zoneName });
        }
      });
      zones.sort(function(a, b) { return a.name.localeCompare(b.name); });

      var select = document.getElementById(selectId);
      zones.forEach(function(z) {
        var opt = document.createElement('option');
        opt.value = z.id;
        opt.textContent = z.name;
        select.appendChild(opt);
      });
    }

    function showError(msg) {
      var el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = msg ? 'block' : 'none';
    }

    function applyFilter() {
      var text = document.getElementById('filter-text').value.toLowerCase();
      var zoneId = document.getElementById('filter-zone').value;

      filteredSlaveDevices = availableDevices.filter(function(d) {
        return (!text || d.name.toLowerCase().includes(text)) &&
               (!zoneId || d.zoneId === zoneId);
      });

      renderDevices(filteredSlaveDevices);
    }

    function renderDevices(devices) {
      var list = document.getElementById('device-list');
      if (devices.length === 0) {
        list.innerHTML = '<div id="loading">' + __('wizard.no_match') + '</div>';
        return;
      }

      list.innerHTML = devices.map(function(d) {
        var isMaster = masterId === d.id;
        var isSlave = Boolean(selectedSlaves[d.id]);
        var selected = isMaster || isSlave ? ' selected' : '';
        var zoneBadge = d.zoneName ? '<span class="device-zone">' + escapeHtml(d.zoneName) + '</span>' : '';
        return '<div class="device-item' + selected + '" id="item-' + escapeHtml(d.id) + '">' +
          '<div class="controls">' +
          '<label class="choice" title="' + escapeHtml(__('master_wizard.master')) + '"><input type="radio" name="master" value="' + escapeHtml(d.id) + '"' + (isMaster ? ' checked' : '') + ' onchange="setMaster(this.value)" />' + __('master_wizard.master_short') + '</label>' +
          '<label class="choice" title="' + escapeHtml(__('master_wizard.slave')) + '"><input type="checkbox" value="' + escapeHtml(d.id) + '"' + (isSlave ? ' checked' : '') + ' onchange="setSlave(this)" />' + __('master_wizard.slave_short') + '</label>' +
          '</div>' +
          '<span class="device-name">' + escapeHtml(d.name) + '</span>' +
          zoneBadge +
          '</div>';
      }).join('');
      updateCount();
    }

    function setMaster(id) {
      masterId = id || null;
      if (masterId) delete selectedSlaves[masterId];
      showError('');
      updateCount();
      applyFilter();
      renderSelected();
    }

    function setSlave(checkbox) {
      if (checkbox.checked && checkbox.value === masterId) {
        checkbox.checked = false;
        return;
      }
      if (checkbox.checked && Object.keys(selectedSlaves).length >= MAX_SLAVES) {
        checkbox.checked = false;
        showError(__('master_wizard.err_max9'));
        return;
      }
      showError('');
      if (checkbox.checked) selectedSlaves[checkbox.value] = true;
      else delete selectedSlaves[checkbox.value];
      updateCount();
      applyFilter();
      renderSelected();
    }

    // "Currently Selected" summary — lets you see (and remove) the whole
    // current selection without scrolling a list that can hold 100+ devices,
    // and shows the master/slaves that used to be selected but no longer exist.
    function renderSelected() {
      var section = document.getElementById('selected-section');
      var list = document.getElementById('selected-list');

      var masterDevice = masterId ? availableDevices.filter(function(d) { return d.id === masterId; })[0] : null;
      var slaveDevices = Object.keys(selectedSlaves)
        .map(function(id) { return availableDevices.filter(function(d) { return d.id === id; })[0]; })
        .filter(Boolean);

      var hasAny = masterDevice || missingMaster || slaveDevices.length > 0 || missingSlaves.length > 0;
      if (!hasAny) {
        section.style.display = 'none';
        list.innerHTML = '';
        return;
      }
      section.style.display = '';

      var rows = '';
      if (masterDevice) {
        rows += selRow(masterDevice.name, masterDevice.zoneName, ' &middot; ' + escapeHtml(__('master_wizard.master')), 'removeMaster()');
      } else if (missingMaster) {
        rows += selMissingRow(missingMaster.name, __('master_wizard.master'));
      }
      slaveDevices.forEach(function(d) {
        rows += selRow(d.name, d.zoneName, '', 'removeSlave(\'' + escapeHtml(d.id) + '\')');
      });
      missingSlaves.forEach(function(m) {
        rows += selMissingRow(m.name, __('master_wizard.slave'));
      });

      list.innerHTML = rows;
    }

    function selRow(name, zoneName, roleBadge, removeCall) {
      var zoneBadge = zoneName ? '<span class="device-zone">' + escapeHtml(zoneName) + '</span>' : '';
      return '<div class="sel-item">' +
        '<span class="device-name">' + escapeHtml(name) + roleBadge + '</span>' + zoneBadge +
        '<button type="button" class="sel-remove" onclick="' + removeCall + '">&times;</button>' +
        '</div>';
    }

    function selMissingRow(name, roleLabel) {
      return '<div class="sel-item missing">' +
        '<span class="device-name">&#9888; ' + escapeHtml(name) + ' &middot; ' + escapeHtml(roleLabel) + '</span>' +
        '<span class="device-zone">' + escapeHtml(__('repair.not_found')) + '</span>' +
        '</div>';
    }

    function removeMaster() {
      masterId = null;
      updateCount();
      applyFilter();
      renderSelected();
    }

    function removeSlave(id) {
      delete selectedSlaves[id];
      updateCount();
      applyFilter();
      renderSelected();
    }

    function saveMaster() {
      showError('');
      var deviceIds = Object.keys(selectedSlaves);
      if (!masterId) { showError(__('master_wizard.err_master_required')); return; }
      if (deviceIds.length < 2) { showError(__('master_wizard.err_min2')); return; }
      if (deviceIds.length > MAX_SLAVES) { showError(__('master_wizard.err_max9')); return; }

      document.getElementById('btn-save').disabled = true;

      Homey.emit('save_config', { masterDeviceId: masterId, deviceIds: deviceIds })
        .then(function() { Homey.done(); })
        .catch(function(err) {
          showError((err && err.message) || __('repair.err_save'));
          document.getElementById('btn-save').disabled = false;
        });
    }

    initTranslations();

    Homey.emit('get_config', null)
      .then(function(config) {
        config = config || {};
        masterId = config.masterDeviceId || null;
        knownNames = config.deviceNames || {};
        (config.deviceIds || []).forEach(function(id) { selectedSlaves[id] = true; });
        return Homey.emit('get_available_devices', null);
      })
      .then(function(devices) {
        availableDevices = devices || [];
        // Drop any previously-saved device that no longer exists in Homey (e.g.
        // deleted and re-paired with a new ID) — it can never be unchecked since
        // it has no row to render, so it must be cleared here instead. Keep its
        // last-known name so "Currently Selected" can still show what it was.
        var validIds = {};
        availableDevices.forEach(function(d) { validIds[d.id] = true; });
        missingSlaves = [];
        Object.keys(selectedSlaves).forEach(function(id) {
          if (!validIds[id]) {
            missingSlaves.push({ id: id, name: knownNames[id] || id });
            delete selectedSlaves[id];
          }
        });
        missingMaster = null;
        if (masterId && !validIds[masterId]) {
          missingMaster = { id: masterId, name: knownNames[masterId] || masterId };
          masterId = null;
        }
        buildZoneOptions('filter-zone', availableDevices);
        applyFilter();
        renderSelected();
        document.getElementById('btn-save').disabled = false;
      })
      .catch(function(err) {
        document.getElementById('loading').textContent = __('repair.err_load') + (err && err.message ? ': ' + err.message : '');
      });
  </script>
</body>
</html>
