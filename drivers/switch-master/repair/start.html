<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }
    h2 { font-size: 18px; margin-bottom: 6px; color: #111; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 20px; }
    label.field-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #555;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      background: #fff;
    }
    select:focus, input[type="text"]:focus { outline: none; border-color: #007aff; }
    .filter-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .filter-row input[type="text"] { flex: 1; margin-bottom: 0; }
    .filter-row select { flex: 1; margin-bottom: 0; }
    #device-list {
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      flex: 1;
      min-height: 100px;
      max-height: 42vh;
      overflow-y: auto;
      margin: 8px 0;
    }
    .device-item {
      display: grid;
      grid-template-columns: 74px 70px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.1s;
    }
    .device-item:last-child { border-bottom: none; }
    .device-item:hover { background: #f7f7f7; }
    .device-item.selected { background: #e8f0fe; }
    .choice {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: #666;
      cursor: pointer;
    }
    .choice input { accent-color: #007aff; }
    .device-name { font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .device-zone { font-size: 11px; color: #aaa; margin-left: 6px; white-space: nowrap; }
    .hint { font-size: 12px; color: #999; margin-bottom: 8px; }
    #error-msg {
      color: #e53e3e;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
    #loading {
      padding: 16px;
      font-size: 13px;
      color: #888;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 8px;
      flex-shrink: 0;
    }
    button:hover { background: #0062cc; }
    button:disabled { background: #aaa; cursor: default; }
  </style>
</head>
<body>
  <h2 id="t-title"></h2>
  <p class="subtitle" id="device-count"></p>

  <label class="field-label" id="t-devices-label"></label>
  <p class="hint" id="t-hint"></p>

  <div class="filter-row">
    <input type="text" id="filter-text" oninput="applyFilter()" />
    <select id="filter-zone" onchange="applyFilter()">
      <option value="" id="t-all-zones"></option>
    </select>
  </div>

  <div id="device-list">
    <div id="loading"></div>
  </div>

  <div id="error-msg"></div>

  <button id="btn-save" onclick="saveMaster()" disabled></button>

  <script>
    var availableDevices = [];
    var selectedSlaves = {};
    var masterId = null;
    var MAX_SLAVES = 9;

    var __ = function(k) { try { return Homey.__(k) || k; } catch(e) { return k; } };

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function initTranslations() {
      document.getElementById('t-title').textContent = __('master_repair.title');
      document.getElementById('t-devices-label').textContent = __('master_wizard.devices_to_control');
      document.getElementById('t-hint').textContent = __('master_wizard.hint_master_slaves');
      document.getElementById('t-all-zones').textContent = __('wizard.all_zones');
      document.getElementById('loading').textContent = __('wizard.loading');
      document.getElementById('btn-save').textContent = __('repair.btn_save');
      document.getElementById('filter-text').placeholder = __('wizard.search_placeholder');
      updateCount();
    }

    function updateCount() {
      var n = Object.keys(selectedSlaves).length;
      var masterText = masterId ? __('master_wizard.master_selected') : __('master_wizard.no_master');
      document.getElementById('device-count').textContent = masterText + ' · ' + n + ' ' + (n !== 1 ? __('wizard.devices') : __('wizard.device')) + ' ' + __('wizard.selected');
    }

    function showError(msg) {
      var el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = msg ? 'block' : 'none';
    }

    function buildZoneOptions(devices) {
      var seen = {};
      var zones = [];
      devices.forEach(function(d) {
        if (d.zoneId && d.zoneName && !seen[d.zoneId]) {
          seen[d.zoneId] = true;
          zones.push({ id: d.zoneId, name: d.zoneName });
        }
      });
      zones.sort(function(a, b) { return a.name.localeCompare(b.name); });

      var select = document.getElementById('filter-zone');
      zones.forEach(function(z) {
        var opt = document.createElement('option');
        opt.value = z.id;
        opt.textContent = z.name;
        select.appendChild(opt);
      });
    }

    function applyFilter() {
      var text = document.getElementById('filter-text').value.toLowerCase();
      var zoneId = document.getElementById('filter-zone').value;

      renderDevices(availableDevices.filter(function(d) {
        return (!text || d.name.toLowerCase().includes(text)) &&
               (!zoneId || d.zoneId === zoneId);
      }));
    }

    function renderDevices(devices) {
      var list = document.getElementById('device-list');
      if (devices.length === 0) {
        list.innerHTML = '<div id="loading">' + __('wizard.no_match') + '</div>';
        return;
      }

      list.innerHTML = devices.map(function(d) {
        var isMaster = masterId === d.id;
        var isSlave = Boolean(selectedSlaves[d.id]);
        var selected = isMaster || isSlave ? ' selected' : '';
        var zoneBadge = d.zoneName ? '<span class="device-zone">' + escapeHtml(d.zoneName) + '</span>' : '';
        return '<div class="device-item' + selected + '" id="item-' + escapeHtml(d.id) + '">' +
          '<label class="choice"><input type="radio" name="master" value="' + escapeHtml(d.id) + '"' + (isMaster ? ' checked' : '') + ' onchange="setMaster(this.value)" />' + __('master_wizard.master') + '</label>' +
          '<label class="choice"><input type="checkbox" value="' + escapeHtml(d.id) + '"' + (isSlave ? ' checked' : '') + (isMaster ? ' disabled' : '') + ' onchange="setSlave(this)" />' + __('master_wizard.slave') + '</label>' +
          '<span class="device-name">' + escapeHtml(d.name) + '</span>' +
          zoneBadge +
          '</div>';
      }).join('');
      updateCount();
    }

    function setMaster(id) {
      masterId = id;
      delete selectedSlaves[id];
      showError('');
      updateCount();
      applyFilter();
    }

    function setSlave(checkbox) {
      if (checkbox.checked && checkbox.value === masterId) {
        checkbox.checked = false;
        return;
      }
      if (checkbox.checked && Object.keys(selectedSlaves).length >= MAX_SLAVES) {
        checkbox.checked = false;
        showError(__('master_wizard.err_max9'));
        return;
      }
      showError('');
      if (checkbox.checked) selectedSlaves[checkbox.value] = true;
      else delete selectedSlaves[checkbox.value];
      updateCount();
      applyFilter();
    }

    function saveMaster() {
      showError('');
      var deviceIds = Object.keys(selectedSlaves);
      if (!masterId) { showError(__('master_wizard.err_master_required')); return; }
      if (deviceIds.length < 2) { showError(__('master_wizard.err_min2')); return; }
      if (deviceIds.length > MAX_SLAVES) { showError(__('master_wizard.err_max9')); return; }

      document.getElementById('btn-save').disabled = true;

      Homey.emit('save_config', { masterDeviceId: masterId, deviceIds: deviceIds })
        .then(function() { Homey.done(); })
        .catch(function(err) {
          showError((err && err.message) || __('repair.err_save'));
          document.getElementById('btn-save').disabled = false;
        });
    }

    initTranslations();

    Homey.emit('get_config', null)
      .then(function(config) {
        config = config || {};
        masterId = config.masterDeviceId || null;
        (config.deviceIds || []).forEach(function(id) { selectedSlaves[id] = true; });
        return Homey.emit('get_available_devices', null);
      })
      .then(function(devices) {
        availableDevices = devices || [];
        buildZoneOptions(availableDevices);
        renderDevices(availableDevices);
        document.getElementById('btn-save').disabled = false;
      })
      .catch(function(err) {
        document.getElementById('loading').textContent = __('repair.err_load') + (err && err.message ? ': ' + err.message : '');
      });
  </script>
</body>
</html>
